<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors game</title>
  </head>
  <body>
    <style>
      body{
        font-family: Arial;
        background-color: black;
        color: white;
      }

      .emoji{
        width: 50px;
        height: 50px;
      }
      .emoji-button{
        background-color: transparent;
        border-radius: 100%;
        border: 2px solid white;
        padding: 10px;
        cursor: pointer;
        margin: 3px;

      }
    </style>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
      playGame();
      playerChoice('rock' , 'paper', 'scissors');
      updateScore(result);
      " class="emoji-button">
      <img src="rsp-emojis/rock-emoji.png" alt="Rock" class="emoji">
    </button>
    <button
    onclick="
      playGame();
      playerChoice('paper' , 'scissors', 'rock');
      updateScore(result);
      " class="emoji-button">
      <img src="rsp-emojis/paper-emoji.png" alt="Paper" class="emoji">
    </button>
    <button 
    onclick="
      playGame();           
      playerChoice('scissors' , 'rock', 'paper');
      updateScore(result); 
    " class="emoji-button">
      <img src="rsp-emojis/scissors-emoji.png" alt="Scissors" class="emoji">
    </button>
    <p id = "result">
    </p>
    <p id="score-text">
    </p>
    <p id="score-update">
    </p>
    <button onclick="
      localStorage.removeItem('storedScore');
      score = 0;
      document.getElementById('score-text').textContent = 'Score: ' + score;
      storedScore.wins = 0;
      storedScore.losses = 0;
      storedScore.ties = 0;
      document.getElementById('score-update').textContent = `win : ${storedScore.wins} , lose : ${storedScore.losses} , tie : ${storedScore.ties}`;
      ">
      reset score
    </button>
    
    <script>
      
      let computerChoice = " ";
      let score = 0;
      let result = " ";
      
      // console.log(localStorage.getItem('neha'));
      
      let storedScore = JSON.parse(localStorage.getItem('storedScore')) ||{
        wins: 0,
        losses: 0,
        ties: 0
      };
      // if(storedScore === null){
      //   storedScore = {
      //     wins: 0,
      //     losses: 0,
      //     ties: 0
      //   }
      // }
      
      function playGame() {
        const randomNumber = Math.random();
        
        if (randomNumber < 0.33) {
          computerChoice = 'rock';
        }
        else if (randomNumber < 0.66) {
          computerChoice = 'paper'
        }
        else {
          computerChoice = 'scissors'
        }
      }
      
      function playerChoice(para1 , para2, para3) {
        if (computerChoice === para1) {
          score = score + 0;
          document.getElementById('score-text').textContent = 'Score: ' + score;
          console.log('Score: ' + score);
          result = 'tie';
          document.getElementById('result').textContent = `Computer chose  ${computerChoice}. ${result}!`;
        }
        else if (computerChoice === para2) {
          score = score - 1;
          document.getElementById('score-text').textContent = 'Score: ' + score;
          console.log('Score: ' + score);
          result = 'lose';
          document.getElementById('result').textContent = `Computer chose  ${computerChoice}. ${result}!`;
        }
        else if (computerChoice === para3) {
          score = score + 1;
          document.getElementById('score-text').textContent = 'Score: ' + score;
          console.log('Score: ' + score);
          result = 'win';
          document.getElementById('result').textContent = `Computer chose  ${computerChoice}. ${result}!`;   
          
        }
      }
      
      
      
      
      function updateScore(result) {
        if(result === 'win'){
          storedScore.wins = storedScore.wins + 1
          document.getElementById("score-update").textContent = `win : ${storedScore.wins} , lose : ${storedScore.losses} , tie : ${storedScore.ties}`
        }
        else if(result === 'lose'){
          storedScore.losses = storedScore.losses + 1
          document.getElementById("score-update").textContent = `win : ${storedScore.wins} , lose : ${storedScore.losses} , tie : ${storedScore.ties}`
        }
        else if(result === 'tie'){
          storedScore.ties = storedScore.ties + 1
          document.getElementById("score-update").textContent = `win : ${storedScore.wins} , lose : ${storedScore.losses} , tie : ${storedScore.ties}`
        }
        
        localStorage.setItem('storedScore', JSON.stringify(storedScore));
      }
      
      
      console.log(score);
      </script>

</html>
