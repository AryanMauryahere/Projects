<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors game</title>
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
    
  playGame();
  if (computerChoice === 'paper') {
    score = score - 1;
    document.getElementById('score-text').textContent = 'Score: ' + score;
    console.log('Score: ' + score);
  }
  
  else if (computerChoice === 'Rock') {
    score = score + 0;
    document.getElementById('score-text').textContent = 'Score: ' + score;
    console.log('Score: ' + score);
  }
  
  else {
    score = score + 1;
    document.getElementById('score-text').textContent = 'Score: ' + score;
    console.log('Score: ' + score);
  }
    
  ">
      Rock
    </button>
    <button
    onclick="
    playGame();
    if (computerChoice === 'paper') {
      score = score + 0;
      document.getElementById('score-text').textContent = 'Score: ' + score;
      console.log('Score: ' + score);
    }
    
    else if (computerChoice === 'Rock') {
      score = score + 1;
      document.getElementById('score-text').textContent = 'Score: ' + score;
      console.log('Score: ' + score);
    }
    
    else {
      score = score - 1;
      document.getElementById('score-text').textContent = 'Score: ' + score;
      console.log('Score: ' + score);
    }
    ">
      Paper
    </button>
    <button 
    onclick="

      playGame();           
      if (computerChoice === 'paper') {
        score = score + 1;
        document.getElementById('score-text').textContent = 'Score: ' + score;
        console.log('Score: ' + score);
      }
      
      else if (computerChoice === 'Rock') {
        score = score - 1;
        document.getElementById('score-text').textContent = 'Score: ' + score;
        console.log('Score: ' + score);
      }
      
      else {
        score = score + 0;
        document.getElementById('score-text').textContent = 'Score: ' + score;
        console.log('Score: ' + score);
      }
      ">
      Scissors
    </button>
    
    <p id="score-text">
      
    </p>
    
    <script>

      let computerChoice = " ";
      let score = 0;
      
      function playGame() {
      const randomNumber = Math.random();
      
      if (randomNumber < 0.33) {
        computerChoice = 'Rock';
      }
      else if (randomNumber < 0.66) {
        computerChoice = 'paper'
      }
      else {
        computerChoice = 'scissors'
      }
    }

      console.log(score)
    </script>

</html>
